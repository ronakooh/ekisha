<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ekisha Budget Control</title>
<script>
const CORRECT_PIN = '9405';
const SESSION_KEY = 'ekisha_auth';
const SESSION_TTL = 8 * 60 * 60 * 1000;

function checkAuth() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (s) { const {ts} = JSON.parse(s); if (Date.now()-ts < SESSION_TTL) return true; sessionStorage.removeItem(SESSION_KEY); }
  return false;
}
function saveAuth() { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ts: Date.now()})); }
function showPinScreen() { document.getElementById('pinScreen').style.display='flex'; document.getElementById('app').style.display='none'; setTimeout(()=>document.getElementById('pinInput').focus(),100); }
function showApp() { document.getElementById('pinScreen').style.display='none'; document.getElementById('app').style.display='block'; }
function submitPin() {
  const entered = document.getElementById('pinInput').value;
  if (entered === CORRECT_PIN) { saveAuth(); showApp(); loadStatus(); }
  else {
    const b = document.getElementById('pinInput'); b.value=''; b.placeholder='Wrong PIN — try again'; b.style.borderColor='#A32D2D';
    setTimeout(()=>{b.placeholder='Enter PIN';b.style.borderColor='';},2000);
  }
}
window.addEventListener('DOMContentLoaded', ()=>{ if(checkAuth()){showApp();loadStatus();}else{showPinScreen();} });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#dc305f;--green:#0F6E56;--amber:#854F0B;--red:#A32D2D;--blue:#185FA5;--bg:#f5f4f0;--card:#fff;--border:#e0ddd6;--text:#1a1a1a;--muted:#888}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem}
.header{background:var(--pink);color:white;padding:1rem 1.25rem .75rem;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .sub{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block}
.body{padding:1rem;max-width:480px;margin:0 auto}
/* pills */
.pills-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.pill{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left}
.pill:active{transform:scale(.98)}
.pill.selected{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.pill-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.pill-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.pill-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
.pill-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.pill.summary{background:#FBF8F1;border-color:var(--pink);border-width:2px}
.pill-stat{flex:1}
.pill-stat .pv{font-size:15px;font-weight:600}
.pill-stat .pl{font-size:10px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.03em}
.pill-loading{padding:20px 14px;text-align:center;color:var(--muted);font-size:12px}
/* detail panel */
.detail-panel{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;display:none}
.detail-panel.visible{display:block}
.detail-header{padding:1rem 1rem .75rem;border-bottom:1px solid var(--border)}
.detail-name{font-size:16px;font-weight:600;color:var(--text)}
.detail-meta{font-size:12px;color:var(--muted);margin-top:3px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.stat-cell{padding:10px 8px;text-align:center;border-right:1px solid var(--border)}
.stat-cell:last-child{border-right:none}
.stat-cell .sv{font-size:15px;font-weight:600;color:var(--text)}
.stat-cell .sl{font-size:10px;color:var(--muted);margin-top:1px}
.override-banner{background:#E6F1FB;border-bottom:1px solid #B5D4F4;padding:8px 1rem;font-size:12px;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.detail-body{padding:1rem}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:1rem}
.tab-btn{flex:1;padding:8px 4px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-size:11px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--pink);border-color:var(--pink);color:white}
.tab-content{display:none}
.tab-content.active{display:block}
/* multipliers */
.section-label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px}
.mult-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.mult-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:8px;background:white;font-size:13px;font-weight:500;cursor:pointer;text-align:center;color:var(--text);transition:all .15s}
.mult-btn.boost.selected{background:#EAF3DE;border-color:var(--green);color:var(--green)}
.mult-btn.suppress.selected{background:#FAEEDA;border-color:var(--amber);color:var(--amber)}
.custom-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.custom-row label{font-size:12px;color:var(--muted);white-space:nowrap}
.custom-row input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.custom-row input:focus{border-color:var(--pink)}
.hours-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.hour-btn{padding:8px 4px;border:1.5px solid var(--border);border-radius:8px;background:white;font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--text);transition:all .15s}
.hour-btn.selected{background:#E6F1FB;border-color:var(--blue);color:var(--blue)}
.preview-box{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px;min-height:40px;line-height:1.5}
.preview-box strong{color:var(--text)}
/* baseline */
.baseline-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.baseline-row label{font-size:12px;color:var(--muted);white-space:nowrap}
.baseline-row input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-weight:500;outline:none}
.baseline-row input:focus{border-color:var(--green)}
/* buttons */
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pink{background:var(--pink);color:white}
.btn-green{background:var(--green);color:white}
.btn-clear{background:none;border:1.5px solid var(--red);color:var(--red);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
/* metrics */
.period-tabs{display:flex;gap:5px;margin-bottom:1rem}
.period-btn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-size:11px;font-weight:500;cursor:pointer;color:var(--muted);text-align:center;transition:all .15s}
.period-btn.active{background:var(--blue);border-color:var(--blue);color:white}
.metrics-loading{text-align:center;padding:1.5rem;color:var(--muted);font-size:13px}
.metrics-spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.metric-section-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .5rem;padding-top:.75rem;border-top:.5px solid var(--border)}
.metric-section-title:first-child{border-top:none;margin-top:0;padding-top:0}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:.5rem}
.metric-card{background:var(--bg);border-radius:10px;padding:10px 12px}
.metric-card .mv{font-size:18px;font-weight:600;color:var(--text)}
.metric-card .ml{font-size:11px;color:var(--muted);margin-top:2px}
.metric-card.wide{grid-column:span 2}
.metric-card.good .mv{color:var(--green)}
.metric-card.bad .mv{color:var(--red)}
.metric-card.warn .mv{color:var(--amber)}
/* adset table */
.adset-scroll{overflow-x:auto;margin-top:.5rem;border-radius:8px;border:.5px solid var(--border)}
.adset-table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
.adset-table th{background:#f5f4f0;padding:7px 8px;text-align:left;font-weight:500;color:var(--muted);border-bottom:.5px solid var(--border);white-space:nowrap;position:sticky;top:0}
.adset-table td{padding:7px 8px;border-bottom:.5px solid var(--border);color:var(--text);white-space:nowrap}
.adset-table tr:last-child td{border-bottom:none}
.adset-table tr:hover td{background:#fafaf8}
.adset-name-cell{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.good-cell{color:var(--green);font-weight:500}
.bad-cell{color:var(--red);font-weight:500}
.warn-cell{color:var(--amber);font-weight:500}
/* misc */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.section-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.refresh-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:14px}
.spinner{width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .5rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.badge-green{background:#EAF3DE;color:var(--green)}
.badge-amber{background:#FAEEDA;color:var(--amber)}
.badge-blue{background:#E6F1FB;color:var(--blue)}

/* ── rail images ── */
.rl-box{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.rl-row{display:flex;gap:8px;align-items:center}
.rl-in{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fff;font-family:inherit}
.rl-in:focus{border-color:var(--pink)}
textarea.rl-in{width:100%;min-height:74px;resize:vertical;line-height:1.4}
.rl-btn{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap}
.rl-btn:disabled{opacity:.5;cursor:not-allowed}
.rl-btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.rl-btn.green{background:var(--green);border-color:var(--green);color:#fff}
.rl-btn.red{border-color:var(--red);color:var(--red)}
.rl-btn.wide{width:100%;padding:12px;font-size:14px}
.rl-sub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.rl-sub:first-child{margin-top:0}
.rl-prod{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:.5px solid var(--border)}
.rl-prod:first-child{border-top:none}
.rl-thumb{width:46px;height:58px;border-radius:6px;background:#f1eee8;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.rl-thumb img{width:100%;height:100%;object-fit:contain}
.rl-info{flex:1;min-width:0}
.rl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-meta{font-size:11px;color:var(--muted);margin-top:2px}
.rl-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-right:4px}
.rl-badge.ok{background:#EAF3DE;color:var(--green)}
.rl-badge.draft{background:#FAEEDA;color:var(--amber)}
.rl-badge.live{background:#E6F1FB;color:var(--blue)}
.rl-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rl-photo{font-size:10px}
.rl-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;display:block;margin-bottom:3px;background:#eee}
.rl-photo select{width:100%;font-size:11px;padding:4px;border:1.5px solid var(--border);border-radius:6px;background:#fff}
.rl-checker{background-color:#f6f1ea;background-image:linear-gradient(45deg,#e9e3d9 25%,transparent 25%,transparent 75%,#e9e3d9 75%),linear-gradient(45deg,#e9e3d9 25%,transparent 25%,transparent 75%,#e9e3d9 75%);background-size:16px 16px;background-position:0 0,8px 8px;border-radius:10px;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.rl-checker img{width:100%;height:100%;object-fit:contain}
.rl-empty{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;color:var(--muted);font-size:12px;margin-bottom:8px}
.rl-cands{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.rl-cand{width:54px;height:68px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:#eee}
.rl-cand.sel{border-color:var(--pink)}
.rl-sl{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin:3px 0}
.rl-sl input{width:100%}
.rl-err{color:var(--red);font-size:12px;padding:8px 0}
.rl-cfg{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.rl-spin{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen" style="display:none;position:fixed;inset:0;background:#f5f4f0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:2rem">
  <div style="text-align:center;max-width:280px;width:100%">
    <div style="font-size:40px;margin-bottom:1rem">🔐</div>
    <div style="font-size:20px;font-weight:700;margin-bottom:.35rem">Ekisha Budget Control</div>
    <div style="font-size:13px;color:#888;margin-bottom:2rem">Enter your PIN to continue</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN"
      onkeydown="if(event.key==='Enter')submitPin()"
      style="width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:8px;border:2px solid #e0ddd6;border-radius:12px;outline:none;background:white;margin-bottom:1rem">
    <button onclick="submitPin()" style="width:100%;padding:13px;background:#dc305f;color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer">Unlock</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
<div class="header">
  <h1>Ekisha Budget Control</h1>
  <div class="sub"><span class="dot"></span><span id="headerTime">Loading...</span></div>
</div>
<div class="body">
  <div id="loadingState" class="loading"><div class="spinner"></div>Connecting to Meta...</div>
  <div id="mainContent" style="display:none">
    <div class="top-bar">
      <div class="section-title">Campaigns</div>
      <button class="refresh-btn" onclick="loadStatus()">↻ Refresh</button>
    </div>
    <div class="period-tabs" id="pillPeriodTabs" style="margin-bottom:.75rem">
      <button class="period-btn active" onclick="selectPillPeriod('today',this)">Today</button>
      <button class="period-btn" onclick="selectPillPeriod('yesterday',this)">Yesterday</button>
      <button class="period-btn" onclick="selectPillPeriod('last_7d',this)">7 days</button>
      <button class="period-btn" onclick="selectPillPeriod('last_14d',this)">15 days</button>
      <button class="period-btn" onclick="selectPillPeriod('last_30d',this)">30 days</button>
    </div>
    <div class="pills-grid" id="pillsGrid"></div>
    <div class="detail-panel" id="detailPanel"></div>

    <div class="top-bar" style="margin-top:1.5rem">
      <div class="section-title">Order Tracking — CAPI Relay</div>
      <button class="refresh-btn" onclick="loadCapiQueue()">↻ Refresh</button>
    </div>
    <div id="capiQueueSummary" class="pill summary" style="margin-bottom:.75rem">
      <div class="pill-top"><div class="pill-name">📦 Pending Orders</div></div>
      <div class="pill-loading">Loading...</div>
    </div>
    <div id="capiQueueTableWrap"></div>

    <div class="top-bar" style="margin-top:1.25rem;margin-bottom:.5rem">
      <div class="section-title">Recently sent to Meta</div>
      <select id="capiSentPeriodSelect" onchange="selectCapiSentPeriod(this.value)"
        style="border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted);background:var(--card)">
        <option value="today" selected>Today</option>
        <option value="3">Last 3 days</option>
        <option value="7">Last 7 days</option>
        <option value="all">All</option>
      </select>
    </div>
    <div id="capiSentTableWrap"></div>

    <div class="top-bar" style="margin-top:1.25rem;margin-bottom:.5rem">
      <div class="section-title">Cancelled Orders</div>
      <select id="capiCancelledPeriodSelect" onchange="selectCapiCancelledPeriod(this.value)"
        style="border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted);background:var(--card)">
        <option value="today" selected>Today</option>
        <option value="3">Last 3 days</option>
        <option value="7">Last 7 days</option>
        <option value="all">All</option>
      </select>
    </div>
    <div id="capiCancelledTableWrap"></div>

    <details id="railDetails" style="margin-top:1.5rem" ontoggle="if(this.open)railInit()">
      <summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <span class="section-title">Rail images — website clothing rail</span>
        <span style="font-size:11px;color:var(--muted)">tap to open</span>
      </summary>
      <div id="railWrap"></div>
    </details>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SERVICE_URL = 'https://ekisha-budget-manager-350350273853.asia-south1.run.app';
const CAPI_RELAY_URL = 'https://ekisha-capi-relay-350350273853.asia-south1.run.app';
const COD_TIMEOUT_HOURS = 48; // matches capi_relay.py's default sweep threshold
let capiSentPeriod = 'today'; // 'today', '3', '7', or 'all' — matches capi_relay.py's sent_days param
let capiCancelledPeriod = 'today'; // 'today', '3', '7', or 'all' — matches capi_relay.py's cancelled_days param
let campaigns = [], selectedIdx = null, selectedMult = {}, selectedHours = {};
let currentPeriod = 'last_7d', metricsCache = {};
let pillMetrics = {}; // idx -> {roas, purchases, ctr, ...} for pill display, from the selected pillPeriod
let pillPeriod = 'today';
let breakdownRawData = {}; // stateKey -> raw rows for a breakdown table (hourly/age/platform), for re-sorting without a refetch
let breakdownSortState = {}; // stateKey -> {col, dir}; absent = default sort for that table
let breakdownMeta = {}; // stateKey -> {labelHeader, tableKey, idx}, needed to rebuild the table on a header click

// ── LOAD STATUS ──
async function loadStatus() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('mainContent').style.display  = 'none';
  try {
    const res  = await fetch(`${SERVICE_URL}/?action=status`);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error('Bad response');
    campaigns = data.campaigns;
    document.getElementById('headerTime').textContent = data.server_time_ist || '';
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display  = 'block';
    metricsCache = {};
    pillMetrics = {};
    renderPills(); // render immediately with loading placeholders
    loadPillMetrics(); // then fill in ROAS/purchases/CTR per pill as they arrive
    if (selectedIdx !== null) renderDetail(selectedIdx);
    loadCapiQueue(); // independent widget — failure here shouldn't block campaign view
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      `<div style="color:#A32D2D">Failed to load<br><small>${e.message}</small></div>`;
  }
}

// ── CAPI RELAY QUEUE (pending orders not yet sent to Meta) ──
async function selectCapiSentPeriod(period) {
  capiSentPeriod = period;
  await loadCapiQueue();
}

async function selectCapiCancelledPeriod(period) {
  capiCancelledPeriod = period;
  await loadCapiQueue();
}

async function loadCapiQueue() {
  const summaryEl = document.getElementById('capiQueueSummary');
  const tableWrap = document.getElementById('capiQueueTableWrap');
  if (!summaryEl || !tableWrap) return;

  try {
    const res  = await fetch(`${CAPI_RELAY_URL}/?hook=status&sent_days=${capiSentPeriod}&cancelled_days=${capiCancelledPeriod}`);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error('Bad response');

    const pending  = data.pending || [];
    const cod      = pending.filter(p => p.type === 'cod');
    const prepaid  = pending.filter(p => p.type === 'prepaid');
    const overdue  = cod.filter(p => p.age_hours > COD_TIMEOUT_HOURS);

    summaryEl.innerHTML = `
      <div class="pill-top">
        <div class="pill-name">📦 Pending Orders</div>
        <span class="pill-badge ${overdue.length ? 'badge-amber' : 'badge-green'}">${pending.length} waiting</span>
      </div>
      <div class="pill-stats">
        <div class="pill-stat"><div class="pv">${cod.length}</div><div class="pl">COD queued</div></div>
        <div class="pill-stat"><div class="pv">${prepaid.length}</div><div class="pl">Prepaid queued</div></div>
        <div class="pill-stat"><div class="pv" style="color:${overdue.length ? 'var(--red)' : 'var(--green)'}">${overdue.length}</div><div class="pl">Overdue (48h+)</div></div>
      </div>
    `;

    if (!pending.length) {
      tableWrap.innerHTML = '';
    } else {
      const rows = pending
        .sort((a,b) => b.age_hours - a.age_hours)
        .map(p => {
          const isOverdue = p.type === 'cod' && p.age_hours > COD_TIMEOUT_HOURS;
          return `
            <tr${isOverdue ? ' style="background:#FCEEEE"' : ''}>
              <td class="adset-name-cell" title="${p.order_name || p.order_id}">${p.order_name || p.order_id}</td>
              <td style="text-transform:capitalize">${p.type}</td>
              <td>${fmt(p.value)}</td>
              <td class="${isOverdue ? 'bad-cell' : ''}">${p.age_hours}h${isOverdue ? ' ⚠' : ''}</td>
            </tr>`;
        }).join('');

      tableWrap.innerHTML = `
        <div class="adset-scroll">
          <table class="adset-table">
            <thead><tr><th>Order</th><th>Type</th><th>Value</th><th>Waiting</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${pending.some(p => p.type === 'cod' && p.age_hours > COD_TIMEOUT_HOURS)
          ? '<div style="font-size:11px;color:var(--red);margin-top:6px">⚠ Orders past 48h without ORDER_CONFIRMED/cancellation need a manual check in Shopify.</div>'
          : ''}
      `;
    }

    // Recently sent to Meta — covers orders that fired and left the pending
    // queue too fast to catch above (prepaid, or a COD confirmed in seconds).
    const sentWrap = document.getElementById('capiSentTableWrap');
    const sentRecent = data.sent_recent || [];
    if (!sentRecent.length) {
      sentWrap.innerHTML = '<div class="pill-loading">Nothing sent in this period.</div>';
    } else {
      const totActual = sentRecent.reduce((a, s) => a + (Number(s.value) || 0), 0);
      const totSent   = sentRecent.reduce((a, s) => a + (Number(s.sent_value ?? s.value) || 0), 0);
      const totHidden = totActual - totSent;
      const sentRows = sentRecent.map(s => {
        const mins = s.minutes_ago;
        const whenLabel = mins < 60 ? `${Math.round(mins)}m ago`
                         : mins < 1440 ? `${Math.round(mins/60)}h ago`
                         : `${Math.round(mins/1440)}d ago`;
        return `
          <tr>
            <td class="adset-name-cell" title="${s.order_name || s.order_id}">${s.order_name || s.order_id}</td>
            <td style="text-transform:capitalize">${s.type}</td>
            <td>${fmt(s.value)}</td>
            <td${s.capped ? ' style="color:var(--amber, #d98a00);font-weight:600"' : ''}>${fmt(s.sent_value ?? s.value)}${s.capped ? ' ⚠ capped' : ''}</td>
            <td class="good-cell">${whenLabel}</td>
          </tr>`;
      }).join('');
      sentWrap.innerHTML = `
        <div class="adset-scroll">
          <table class="adset-table">
            <thead><tr><th>Order</th><th>Type</th><th>Actual value</th><th>Sent to Meta</th><th>Sent</th></tr></thead>
            <tbody>${sentRows}</tbody>
            <tfoot><tr style="font-weight:700">
              <td colspan="2">Total (${sentRecent.length} orders)</td>
              <td>${fmt(totActual)}</td>
              <td>${fmt(totSent)}${totHidden > 0 ? ` <span style="font-weight:400;opacity:.7">(${fmt(totHidden)} not reported)</span>` : ''}</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
      `;
    }

    // Cancelled orders — orders dropped from the queue via a cancellation
    // tag, Shopify's own orders/cancelled webhook, or a voided/refunded
    // financial status. Never sent to Meta.
    const cancelledWrap = document.getElementById('capiCancelledTableWrap');
    const cancelledRecent = data.cancelled_recent || [];
    if (!cancelledRecent.length) {
      cancelledWrap.innerHTML = '<div class="pill-loading">No cancellations in this period.</div>';
    } else {
      const cancelledRows = cancelledRecent.map(c => {
        const mins = c.minutes_ago;
        const whenLabel = mins < 60 ? `${Math.round(mins)}m ago`
                         : mins < 1440 ? `${Math.round(mins/60)}h ago`
                         : `${Math.round(mins/1440)}d ago`;
        return `
          <tr>
            <td class="adset-name-cell" title="${c.order_name || c.order_id}">${c.order_name || c.order_id}</td>
            <td>${fmt(c.value)}</td>
            <td style="text-transform:capitalize">${c.reason}</td>
            <td class="bad-cell">${whenLabel}</td>
          </tr>`;
      }).join('');
      cancelledWrap.innerHTML = `
        <div class="adset-scroll">
          <table class="adset-table">
            <thead><tr><th>Order</th><th>Value</th><th>Reason</th><th>Cancelled</th></tr></thead>
            <tbody>${cancelledRows}</tbody>
          </table>
        </div>
      `;
    }
  } catch(e) {
    summaryEl.innerHTML = `<div class="pill-top"><div class="pill-name">📦 Pending Orders</div></div><div class="pill-loading" style="color:var(--red)">Failed to load — check CAPI_RELAY_URL / CORS</div>`;
    tableWrap.innerHTML = '';
    const sentWrap = document.getElementById('capiSentTableWrap');
    if (sentWrap) sentWrap.innerHTML = '';
    const cancelledWrap = document.getElementById('capiCancelledTableWrap');
    if (cancelledWrap) cancelledWrap.innerHTML = '';
  }
}

// ── PILL PERIOD SELECTOR ──
function selectPillPeriod(period, btn) {
  pillPeriod = period;
  document.querySelectorAll('#pillPeriodTabs .period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pillMetrics = {};
  renderPills(); // show loading placeholders immediately
  loadPillMetrics();
}

// ── PILL METRICS (ROAS/purchases/CTR/ATC for the selected pillPeriod, fetched per campaign) ──
async function loadPillMetrics() {
  const periodAtRequestTime = pillPeriod; // guard against a stale response overwriting a newer period switch
  campaigns.forEach(async (c, idx) => {
    try {
      const url  = `${SERVICE_URL}/?action=metrics&campaign=${encodeURIComponent(c.campaign)}&period=${periodAtRequestTime}`;
      const res  = await fetch(url);
      const data = await res.json();
      if (periodAtRequestTime !== pillPeriod) return; // period changed again before this response landed — discard
      if (data.status === 'ok') {
        metricsCache[`${c.campaign}__${periodAtRequestTime}`] = data;
        const m = data.campaign_metrics;
        pillMetrics[idx] = m ? { roas: m.roas, purchases: m.purchases, ctr: m.ctr, spend: m.spend, atc: m.atc, cost_per_atc: m.cost_per_atc, conv_value: m.conv_value, impressions: m.impressions } : null;
      } else {
        pillMetrics[idx] = null;
      }
    } catch(e) {
      if (periodAtRequestTime !== pillPeriod) return;
      pillMetrics[idx] = null;
    }
    if (periodAtRequestTime === pillPeriod) renderPills(); // re-render as each campaign's metrics arrive, so pills fill in progressively
  });
}

// ── PILLS ──
function roasClass(v) { return v >= 2.5 ? 'good' : v >= 1.5 ? 'warn' : 'bad'; }
function roasColor(v) {
  if (v === null || v === undefined) return 'var(--muted)';
  return v >= 2.5 ? 'var(--green)' : v >= 1.5 ? 'var(--amber)' : 'var(--red)';
}

function renderPills() {
  const grid = document.getElementById('pillsGrid');
  grid.innerHTML = '';
  campaigns.forEach((c, idx) => {
    const hasOverride = c.override !== null;
    const badgeClass = hasOverride ? 'badge-blue' : 'badge-green';
    const badgeText  = hasOverride ? `⚡ ${c.override.multiplier}×` : `₹${(c.live_rs||0).toLocaleString('en-IN')}/day`;
    const m = pillMetrics[idx];
    const isSelected = selectedIdx === idx;

    const pill = document.createElement('div');
    pill.className = 'pill' + (isSelected ? ' selected' : '');
    pill.onclick = () => selectCampaign(idx);

    const statsHtml = (m === undefined) ? `
      <div class="pill-loading">Loading today's metrics...</div>
    ` : (m === null) ? `
      <div class="pill-loading" style="color:var(--red)">Metrics unavailable</div>
    ` : `
      <div class="pill-stats">
        <div class="pill-stat"><div class="pv" style="color:${roasColor(m.roas)}">${m.roas ? m.roas+'×' : '—'}</div><div class="pl">ROAS</div></div>
        <div class="pill-stat"><div class="pv">${m.spend !== undefined && m.spend !== null ? '₹'+m.spend.toLocaleString('en-IN') : '—'}</div><div class="pl">Spend</div></div>
        <div class="pill-stat"><div class="pv">${m.purchases ?? '—'}</div><div class="pl">Purchases</div></div>
        <div class="pill-stat"><div class="pv">${m.ctr ? m.ctr+'%' : '—'}</div><div class="pl">CTR</div></div>
        <div class="pill-stat"><div class="pv">${m.atc ?? '—'}</div><div class="pl">ATC</div></div>
        <div class="pill-stat"><div class="pv">${fmtPillRs(m.cost_per_atc)}</div><div class="pl">Cost/ATC</div></div>
      </div>
    `;

    pill.innerHTML = `
      <div class="pill-top">
        <div class="pill-name">${c.campaign}</div>
        <span class="pill-badge ${badgeClass}">${badgeText}</span>
      </div>
      ${statsHtml}
    `;
    grid.appendChild(pill);
  });
  grid.appendChild(buildSummaryPill());
}

function fmtPillRs(v) {
  if (v === null || v === undefined) return '—';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function buildSummaryPill() {
  const loaded = campaigns.map((c,idx) => pillMetrics[idx]).filter(m => m && m !== null);
  const pill = document.createElement('div');
  pill.className = 'pill summary';

  if (!loaded.length) {
    pill.innerHTML = `<div class="pill-top"><div class="pill-name">📊 All Campaigns</div></div><div class="pill-loading">Loading...</div>`;
    return pill;
  }

  const totalSpend   = loaded.reduce((s,m) => s + (m.spend || 0), 0);
  const totalPurch   = loaded.reduce((s,m) => s + (m.purchases || 0), 0);
  const totalAtc     = loaded.reduce((s,m) => s + (m.atc || 0), 0);
  const totalConvVal = loaded.reduce((s,m) => s + (m.conv_value || 0), 0);
  const blendedRoas  = totalSpend > 0 ? +(totalConvVal / totalSpend).toFixed(2) : 0;
  const avgCtr       = loaded.filter(m=>m.ctr).length
    ? +(loaded.reduce((s,m) => s + (m.ctr || 0), 0) / loaded.filter(m=>m.ctr).length).toFixed(2) : 0;
  const costPerAtc   = totalAtc > 0 ? totalSpend / totalAtc : null;

  pill.innerHTML = `
    <div class="pill-top">
      <div class="pill-name">📊 All Campaigns</div>
      <span class="pill-badge badge-amber">${loaded.length}/${campaigns.length} loaded</span>
    </div>
    <div class="pill-stats">
      <div class="pill-stat"><div class="pv" style="color:${roasColor(blendedRoas)}">${blendedRoas ? blendedRoas+'×' : '—'}</div><div class="pl">Blended ROAS</div></div>
      <div class="pill-stat"><div class="pv">${fmtPillRs(totalSpend)}</div><div class="pl">Total Spend</div></div>
      <div class="pill-stat"><div class="pv">${totalPurch}</div><div class="pl">Purchases</div></div>
      <div class="pill-stat"><div class="pv">${avgCtr ? avgCtr+'%' : '—'}</div><div class="pl">Avg CTR</div></div>
      <div class="pill-stat"><div class="pv">${totalAtc}</div><div class="pl">Total ATC</div></div>
      <div class="pill-stat"><div class="pv">${fmtPillRs(costPerAtc)}</div><div class="pl">Cost/ATC</div></div>
    </div>
  `;
  return pill;
}

function selectCampaign(idx) {
  selectedIdx = idx;
  currentPeriod = 'last_7d';
  renderPills(); // update selected-state highlight
  renderDetail(idx);
  // scroll the detail panel into view — pills replace the dropdown, so there's
  // no fixed anchor point above the panel anymore
  setTimeout(() => {

}

// ── TAB SWITCHING ──
function switchTab(idx, tab, btn) {
  const panel = document.getElementById('detailPanel');
  panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  panel.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tab}-${idx}`).classList.add('active');
}

// ── METRICS ──
function selectPeriod(idx, period, btn) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = period;
  loadMetrics(idx, period);
}

async function loadMetrics(idx, period) {
  const c       = campaigns[idx];
  const cacheKey = `${c.campaign}__${period}`;
  const content = document.getElementById(`metricsContent-${idx}`);
  if (!content) return;

  // Use cache if available (pill pre-fetch already cached 'today' for every campaign)
  if (metricsCache[cacheKey]) {
    renderMetrics(idx, metricsCache[cacheKey]);
    return;
  }

  content.innerHTML = '<div class="metrics-loading"><div class="metrics-spinner"></div>Loading metrics...</div>';
  try {
    const url  = `${SERVICE_URL}/?action=metrics&campaign=${encodeURIComponent(c.campaign)}&period=${period}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.error || 'Bad response');
    metricsCache[cacheKey] = data;
    renderMetrics(idx, data);
  } catch(e) {
    content.innerHTML = `<div style="color:var(--red);font-size:13px;padding:.5rem">Failed to load metrics: ${e.message}</div>`;
  }
}

function fmt(val, prefix='₹', suffix='', decimals=0) {
  if (val === null || val === undefined) return '—';
  const n = parseFloat(val);
  if (isNaN(n)) return '—';
  return prefix + n.toLocaleString('en-IN', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}) + suffix;
}

function cprClass(v) { return v && v < 500 ? 'good' : v && v < 800 ? 'warn' : 'bad'; }

function renderMetricCards(m) {
  if (!m) return '<div style="color:var(--muted);font-size:13px">No data for this period</div>';

      <div class="metric-card ${roasClass(m.roas)}"><div class="mv">${m.roas ? m.roas + '×' : '—'}</div><div class="ml">Purchase ROAS</div></div>
      <div class="metric-card ${cprClass(m.cpr)}"><div class="mv">${fmt(m.cpr)}</div><div class="ml">Cost per Purchase</div></div>
      <div class="metric-card"><div class="mv">${m.purchases || 0}</div><div class="ml">Purchases</div></div>
      <div class="metric-card"><div class="mv">${fmt(m.conv_value)}</div><div class="ml">Conv. Value</div></div>
    </div>

    </div>

function defaultSortRows(tableKey, rows) {
  // Hourly defaults to chronological order (00:00 -> 23:00); other
  // breakdowns keep whatever order the backend returned (spend desc).
  if (tableKey === 'hourly') {
    return [...rows].sort((a,b) => {
      const ah = parseInt(a.label, 10), bh = parseInt(b.label, 10);
      return (isNaN(ah) ? 0 : ah) - (isNaN(bh) ? 0 : bh);
    });
  }
  return rows;
}

function compareBreakdownVals(av, bv) {
  if (av === null || av === undefined) av = -Infinity;
  if (bv === null || bv === undefined) bv = -Infinity;
  if (typeof av === 'string' && typeof bv === 'string') {
    const an = parseFloat(av), bn = parseFloat(bv); // handles "07:00", "25-34", etc.
    if (!isNaN(an) && !isNaN(bn)) { av = an; bv = bn; }
  }
  if (av < bv) return -1;
  if (av > bv) return 1;
  return 0;
}

function breakdownColumns(labelHeader) {
  return [
    {key:'label', label: labelHeader},
    {key:'spend', label:'Spend'},
    {key:'roas', label:'ROAS'},
    {key:'purchases', label:'Purch'},
    {key:'atc', label:'ATC'},
    {key:'cost_per_atc', label:'Cost/ATC'},
    {key:'ctr', label:'CTR'},
  ];
}

function buildBreakdownTableInner(stateKey, labelHeader, tableKey) {
  const rows = breakdownRawData[stateKey] || [];
  const state = breakdownSortState[stateKey];
  const displayRows = state
    ? [...rows].sort((a,b) => compareBreakdownVals(a[state.col], b[state.col]) * (state.dir === 'asc' ? 1 : -1))
    : defaultSortRows(tableKey, rows);

  const headerCells = breakdownColumns(labelHeader).map(c => {
    const isActive = state && state.col === c.key;
    const arrow = isActive ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th style="cursor:pointer;user-select:none" onclick="toggleBreakdownSort('${stateKey}','${c.key}')">${c.label}${arrow}</th>`;
  }).join('');

  const body = displayRows.map(r => `
    <tr>
      <td>${r.label}</td>
      <td>${fmt(r.spend,'₹')}</td>
      <td class="${roasClass(r.roas)}-cell">${r.roas ? r.roas+'×' : '—'}</td>
      <td>${r.purchases || 0}</td>
      <td>${r.atc || 0}</td>
      <td>${fmt(r.cost_per_atc,'₹')}</td>
      <td>${r.ctr ? r.ctr+'%' : '—'}</td>
    </tr>
  `).join('');

  return `<table class="adset-table"><thead><tr>${headerCells}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderBreakdownTable(rows, labelHeader, tableKey, idx) {
  if (!rows || !rows.length) return '<div style="color:var(--muted);font-size:12px;padding:.25rem 0 .5rem">No breakdown data for this period</div>';
  const stateKey = `${idx}_${tableKey}`;
  breakdownRawData[stateKey] = rows;
  breakdownMeta[stateKey] = { labelHeader, tableKey, idx };
  return `<div class="adset-scroll" id="breakdownWrap-${stateKey}">${buildBreakdownTableInner(stateKey, labelHeader, tableKey)}</div>`;
}

function toggleBreakdownSort(stateKey, col) {
  const current = breakdownSortState[stateKey];
  const dir = (current && current.col === col && current.dir === 'asc') ? 'desc' : 'asc';
  breakdownSortState[stateKey] = { col, dir };
  const meta = breakdownMeta[stateKey];
  const wrap = document.getElementById(`breakdownWrap-${stateKey}`);
  if (wrap && meta) {
    wrap.innerHTML = buildBreakdownTableInner(stateKey, meta.labelHeader, meta.tableKey);
  }
}

function selectMult(idx, mult, btn) {
  document.getElementById('detailPanel').querySelectorAll('.mult-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMult[idx] = mult;
  const ci = document.getElementById(`customMult-${idx}`);
  if (ci) ci.value = '';
  updatePreview(idx);
}
function onCustomMult(idx, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v >= 0.5 && v <= 3.0) {
    selectedMult[idx] = v;
    document.getElementById('detailPanel').querySelectorAll('.mult-btn').forEach(b => b.classList.remove('selected'));
  } else { selectedMult[idx] = null; }
  updatePreview(idx);
}
function selectHours(idx, hours, btn) {
  document.getElementById('detailPanel').querySelectorAll('.hour-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedHours[idx] = hours;
  updatePreview(idx);
}
function updatePreview(idx) {
  const c    = campaigns[idx];
  const mult = selectedMult[idx];
  const hrs  = selectedHours[idx];
  const box  = document.getElementById(`preview-${idx}`);
  if (!box) return;
  if (!mult || !hrs) { box.innerHTML = 'Select a multiplier and duration above'; return; }
  const base   = c.baseline_rs;
  const target = Math.max(Math.round(base * mult), 450);
  const action = mult >= 1 ? '⬆ Boost' : '⬇ Suppress';
  const color  = mult >= 1 ? 'var(--green)' : 'var(--amber)';
  const now = new Date(); now.setTime(now.getTime() + hrs*3600000);
  const expiry = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})+' IST';
  box.innerHTML = `<strong style="color:${color}">${action}:</strong> ₹${base.toLocaleString('en-IN')} × ${mult}× = <strong>₹${target.toLocaleString('en-IN')}/day</strong> for <strong>${hrs}h</strong> → auto-reverts at ${expiry}`;
}

async function applyBoost(idx) {
  const c = campaigns[idx], mult = selectedMult[idx], hrs = selectedHours[idx];

  if (!hrs)  { showToast('Select a duration','error'); return; }
  const btn = document.getElementById(`boostBtn-${idx}`);
  btn.disabled = true; btn.textContent = 'Applying...';
  try {
    const url  = `${SERVICE_URL}/?action=boost&campaign=${encodeURIComponent(c.campaign)}&multiplier=${mult}&hours=${hrs}`;

}

// ── RAIL IMAGES (website clothing rail: generate → review → publish) ──
const RAIL_URL = 'https://ekisha-rail-350350273853.asia-south1.run.app';
let railKey = '';
try { railKey = localStorage.getItem('ekisha_rail_key') || ''; } catch(e) {}
let railData = null;      // { products, anchor, config }
let railOpen = null;      // handle being edited
let railShop = null;      // Shopify product (photos) for the open handle
const railBlobs = new Map();

function railEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function railWrapSet(html) { const w = document.getElementById('railWrap'); if (w) w.innerHTML = html; }

async function railCall(hook, opts) {
  opts = opts || {};
  const qs = new URLSearchParams(Object.assign({hook}, opts.q || {})).toString();
  const res = await fetch(`${RAIL_URL}/?${qs}`, {
    method: opts.body ? 'POST' : 'GET',
    headers: Object.assign({'X-Rail-Key': railKey}, opts.body ? {'Content-Type': 'application/json'} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok || !data || data.status !== 'ok') throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}

async function railBlob(path, w, ver) {
  const k = `${path}|${w || 0}|${ver || 0}`;
  if (railBlobs.has(k)) return railBlobs.get(k);
  const q = new URLSearchParams({hook: 'img', p: path, v: ver || 0});
  if (w) q.set('w', w);
  const res = await fetch(`${RAIL_URL}/?${q}`, {headers: {'X-Rail-Key': railKey}});
  if (!res.ok) throw new Error('img ' + res.status);
  const url = URL.createObjectURL(await res.blob());
  railBlobs.set(k, url);
  return url;
}
function railHydrate() {
  document.querySelectorAll('#railWrap img[data-rp]').forEach(async img => {
    const p = img.dataset.rp, w = +(img.dataset.w || 0), v = +(img.dataset.rv || 0);
    img.removeAttribute('data-rp');
    try { img.src = await railBlob(p, w, v); } catch(e) { img.alt = '✕'; }
  });
}

// ── key gate + loading ──
function railInit() { if (!railKey) { railRenderKey(); return; } railRefresh(); }

function railRenderKey(msg) {
  railWrapSet(`<div class="rl-box">
    <div class="rl-sub">Rail key</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Enter the key you set when deploying the rail service. It is kept only in this browser.</div>
    ${msg ? `<div class="rl-err">${railEsc(msg)}</div>` : ''}
    <div class="rl-row"><input id="railKeyIn" class="rl-in" type="password" placeholder="Rail key" onkeydown="if(event.key==='Enter')railSaveKey()">
    <button class="rl-btn pink" onclick="railSaveKey()">Save</button></div></div>`);
}
function railSaveKey() {
  const v = (document.getElementById('railKeyIn').value || '').trim();
  if (!v) return;
  railKey = v;
  try { localStorage.setItem('ekisha_rail_key', v); } catch(e) {}
  railRefresh();
}
function railForgetKey() {
  railKey = '';
  try { localStorage.removeItem('ekisha_rail_key'); } catch(e) {}
  railRenderKey();
}

async function railRefresh() {
  railWrapSet('<div class="metrics-loading"><div class="metrics-spinner"></div>Loading…</div>');
  try {
    railData = await railCall('list');
    railRender();
  } catch(e) {
    if (/Wrong key|HTTP 401/.test(e.message)) { railRenderKey('Wrong key — try again'); return; }
    railWrapSet(`<div class="rl-err">${railEsc(e.message)}</div><button class="rl-btn" onclick="railRefresh()">↻ Retry</button>`);
  }
}

function railFind(handle) { return (railData.products || []).find(p => p.handle === handle); }
function railPut(p) {
  const i = railData.products.findIndex(x => x.handle === p.handle);
  if (i >= 0) railData.products[i] = p; else railData.products.push(p);
}

// ── main render ──
function railRender() {
  const d = railData, c = d.config || {};
  let h = `<div class="rl-cfg">Model ${railEsc(c.model)} · ${railEsc(c.size)} · today ${c.used_today}/${c.daily_limit} images
    · style reference: ${d.anchor ? railEsc(d.anchor.handle) : 'none yet'}
    · <label style="cursor:pointer;text-decoration:underline">upload style reference<input type="file" accept="image/*" hidden onchange="railUploadAnchor(this)"></label>
    · <a href="#" onclick="railForgetKey();return false" style="color:var(--muted)">change key</a></div>`;

  h += `<div class="rl-box"><div class="rl-sub">Add a product</div>
    <div class="rl-row"><input id="railHandleIn" class="rl-in" placeholder="Product handle or product URL"
      onkeydown="if(event.key==='Enter')railAdd(this)">
    <button class="rl-btn pink" onclick="railAdd(this)">Load</button></div></div>`;

  const prods = (d.products || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (prods.length) {
    h += `<div class="rl-box">`;
    prods.forEach(p => {
      const f = p.views.front, b = p.views.back;
      const badge = (v, label) => v.approved && v.status === 'approved' ? `<span class="rl-badge ok">${label} ✓</span>`
        : v.cur ? `<span class="rl-badge draft">${label} draft</span>` : '';
      const thumb = f.cur ? `<img data-rp="p/${railEsc(p.handle)}/front/cur_thumb.webp" data-w="120" data-rv="${f.ver}">` : '—';
      h += `<div class="rl-prod">
        <div class="rl-thumb">${thumb}</div>
        <div class="rl-info"><div class="rl-name">${railEsc(p.title)}</div>
          <div class="rl-meta">${p.published ? '<span class="rl-badge live">LIVE</span>' : ''}${badge(f, 'Front')}${badge(b, 'Back')}</div></div>
        <div style="display:flex;gap:4px">
          ${p.published ? `<button class="rl-btn" onclick="railMove('${railEsc(p.handle)}',-1,this)">▲</button><button class="rl-btn" onclick="railMove('${railEsc(p.handle)}',1,this)">▼</button>` : ''}
          <button class="rl-btn" onclick="railEdit('${railEsc(p.handle)}',this)">${railOpen === p.handle ? 'Opened' : 'Open'}</button></div></div>`;
    });
    h += `</div>`;
  }
  if (railOpen && railFind(railOpen)) h += railEditorHtml(railFind(railOpen));
  h += `<button class="refresh-btn" onclick="railRefresh()">↻ Refresh</button>`;
  railWrapSet(h);
  railHydrate();
}

// ── add / open ──
function railParseHandle(s) {
  s = (s || '').trim();
  const m = s.match(/\/products\/([a-z0-9_\-]+)/i);
  return (m ? m[1] : s).toLowerCase().replace(/[?#].*$/, '');
}
async function railLoadShop(handle) {
  railShop = (await railCall('product', {q: {handle}})).product;
  return railShop;
}
async function railAdd(btn) {
  const handle = railParseHandle(document.getElementById('railHandleIn').value);
  if (!handle) { showToast('Enter a product handle or URL', 'error'); return; }
  await railDo(btn, 'Loading…', async () => {
    const shop = await railLoadShop(handle);
    if (!railFind(handle)) {
      const r = await railCall('save', {body: {handle, title: shop.title, kind: 'set', refs: {front: shop.images.slice(0, 1), back: [], detail: []}}});
      railPut(r.product);
    }
    railOpen = handle;
    railRender();
    document.getElementById('railEditor')?.scrollIntoView({behavior: 'smooth'});
  });
}
async function railEdit(handle, btn) {
  await railDo(btn, '…', async () => {
    if (!railShop || railShop.handle !== handle) await railLoadShop(handle);
    railOpen = handle;
    railRender();
    document.getElementById('railEditor')?.scrollIntoView({behavior: 'smooth'});
  });
}

async function railDo(btn, text, fn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = text; }
  try { await fn(); } catch(e) { showToast(e.message, 'error'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
}

    <textarea id="rl-back" class="rl-in" style="margin-top:6px;min-height:56px" placeholder="Back: what the back looks like. e.g. Plain back with a yoke seam, no buttons, no pocket.">${railEsc(p.back_desc)}</textarea>

      <button class="rl-btn green" style="flex:1" onclick="railApprove('${h}','${view}',this)">Approve ✓</button></div>
    <label class="rl-btn wide" style="display:block;text-align:center;margin-top:8px;cursor:pointer;box-sizing:border-box">Use a photo I made myself<input type="file" accept="image/*" hidden onchange="railImport('${h}','${view}',this)"></label>
    ${view === 'front' && v.status === 'approved' ? `<button class="rl-btn wide" style="margin-top:8px" onclick="railAnchor('${h}',this)">Use as style reference for new products</button>` : ''}`;
}

// ── actions ──
async function railSaveForm(silent, btn) {
  const p = railFind(railOpen); if (!p) return;
  const refs = {front: [], back: [], detail: []};
  document.querySelectorAll('#railEditor .rl-role').forEach(s => { if (s.value) refs[s.value].push(s.dataset.url); });
  const body = {handle: p.handle, kind: document.getElementById('rl-kind').value,
    front_desc: document.getElementById('rl-front').value, back_desc: document.getElementById('rl-back').value,
    dupatta: document.getElementById('rl-dup').value, cutout: document.getElementById('rl-cut').checked, refs};
  const run = async () => { railPut((await railCall('save', {body})).product); };
  if (silent) { await run(); return; }
  await railDo(btn, 'Saving…', async () => { await run(); showToast('Saved', 'success'); });
}
async function railGenerate(handle, view, btn) {
  await railDo(btn, 'Generating… (30–60 s)', async () => {
    await railSaveForm(true);
    const r = await railCall('generate', {body: {handle, view}});
    railPut(r.product); await railRefreshConfig(); railRender();
    showToast('New ' + view + ' photo ready — check it carefully', 'success');
  });
}
async function railRefreshConfig() { try { const d = await railCall('list'); railData.config = d.config; } catch(e) {} }
async function railSelect(handle, view, gen) {
  try { railPut((await railCall('select', {body: {handle, view, gen}})).product); railRender(); } catch(e) { showToast(e.message, 'error'); }
}
async function railTweak(handle, view, btn) {
  const tweak = {};
  RAIL_SLIDERS.forEach(([k]) => { tweak[k] = +document.getElementById(`rl-${view}-${k}`).value; });
  await railDo(btn, 'Applying…', async () => { await railSaveForm(true); railPut((await railCall('tweak', {body: {handle, view, tweak}})).product); railRender(); });
}
async function railResetTweak(handle, view, btn) {
  await railDo(btn, '…', async () => { railPut((await railCall('tweak', {body: {handle, view, tweak: {}}})).product); railRender(); });
}
async function railApprove(handle, view, btn) {
  await railDo(btn, 'Approving…', async () => {
    await railSaveForm(true);
    railPut((await railCall('approve', {body: {handle, view}})).product); railRender();
    showToast(view + ' approved', 'success');
  });
}
async function railPublish(handle, published, btn) {
  await railDo(btn, '…', async () => {
    railPut((await railCall('publish', {body: {handle, published}})).product); railRender();
    showToast(published ? 'Published to the rail (cached up to 1 min)' : 'Removed from the rail', 'success');
  });
}
async function railMove(handle, dir, btn) {
  await railDo(btn, '…', async () => { const d = await railCall('reorder', {body: {handle, dir}}); railData.products = d.products; railRender(); });
}
async function railAnchor(handle, btn) {
  await railDo(btn, '…', async () => { await railCall('anchor', {body: {handle}}); railData.anchor = {handle}; railRender(); showToast('Style reference set', 'success'); });
}
function railReadFile(input) {
  return new Promise((res, rej) => {
    const f = input.files && input.files[0];
    if (!f) return rej(new Error('No file chosen'));
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('Could not read the file'));
    r.readAsDataURL(f);
  });
}
async function railUploadAnchor(input) {
  try {
    const image = await railReadFile(input);
    showToast('Uploading…');
    await railCall('anchor_upload', {body: {image}});
    railData.anchor = {handle: 'uploaded image'}; railRender(); showToast('Style reference set', 'success');
  } catch(e) { showToast(e.message, 'error'); }
  input.value = '';
}
async function railImport(handle, view, input) {
  try {
    const image = await railReadFile(input);
    showToast('Uploading…');
    await railSaveForm(true);
    railPut((await railCall('import', {body: {handle, view, image}})).product); railRender();
    showToast('Photo added as a draft — review it, then approve', 'success');
  } catch(e) { showToast(e.message, 'error'); }
  input.value = '';
}
async function railDelete(handle, btn) {
  if (!confirm('Delete this product from the rail tool? (It is also removed from the website rail.)')) return;
  await railDo(btn, '…', async () => { const d = await railCall('delete', {body: {handle}}); railData.products = d.products; railOpen = null; railRender(); });
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(()=>t.className='toast',3500);
}
</script>
</div>
</body>
</html>
